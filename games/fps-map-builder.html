<script type="module">
import * as THREE from 'three';
import { TransformControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/TransformControls.js';
import { PointerLockControls } from 'https://unpkg.com/three@0.161.0/examples/jsm/controls/PointerLockControls.js';

// State
let scene, camera, renderer, transformControls;
let objects = []; // { type, mesh, data }
let selectedIndices = [];
let selectionGroup = new THREE.Group();
let snapEnabled = true;
let gridStep = 1;
let copiedObject = null;
let undoStack = [];
const textureCache = {};

const canvas = document.getElementById('view');
const selectionBoxEl = document.getElementById('selectionBox');
let isBoxSelecting = false;
let boxSelectStart = new THREE.Vector2();
let boxSelectEnd = new THREE.Vector2();
const testMapOverlay = document.getElementById('testMapOverlay');
const outlinerEl = document.getElementById('outliner');
const inspectorEl = document.getElementById('inspector');
const statusText = document.getElementById('statusText');

// UI Elements
const btnNew = document.getElementById('btnNew');
const btnOpen = document.getElementById('btnOpen');
const btnSave = document.getElementById('btnSave');
const btnDownload = document.getElementById('btnDownload');
const btnTestMap = document.getElementById('btnTestMap');
const builtinMaps = document.getElementById('builtinMaps');
const btnLoadBuiltin = document.getElementById('btnLoadBuiltin');
const uploadInput = document.getElementById('uploadInput');

const toolMove = document.getElementById('toolMove');
const toolRotate = document.getElementById('toolRotate');
const toolScale = document.getElementById('toolScale');
const btnSnap = document.getElementById('btnSnap');
const btnFocus = document.getElementById('btnFocus');

const addBoxBtn = document.getElementById('addBoxBtn');
const addSpawnBtn = document.getElementById('addSpawnBtn');
const addLightBtn = document.getElementById('addLightBtn');
const addPickupBtn = document.getElementById('addPickupBtn');
const addWallBtn = document.getElementById('addWallBtn');
const addFloorBtn = document.getElementById('addFloorBtn');
const addDoorwayBtn = document.getElementById('addDoorwayBtn');
const addWindowBtn = document.getElementById('addWindowBtn');
const addStairsBtn = document.getElementById('addStairsBtn');
const addRoomBtn = document.getElementById('addRoomBtn');
const snapStepEl = document.getElementById('snapStep');

// Init
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);

  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
  camera.position.set(10, 10, 10);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(width, height, false);
  renderer.setPixelRatio(window.devicePixelRatio);

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(10, 20, 10);
  scene.add(sun);

  // Grid
  const grid = new THREE.GridHelper(100, 100, 0x334155, 0x1e293b);
  scene.add(grid);

  scene.add(selectionGroup);

  // Controls
  transformControls = new TransformControls(camera, renderer.domElement);
  transformControls.addEventListener('dragging-changed', (event) => {
    // Disable camera movement if we had any
    // orbitControls.enabled = !event.value;
  });
  transformControls.addEventListener('change', () => {
    selectedIndices.forEach(i => syncObjectDataFromMesh(i));
  });
  transformControls.addEventListener('dragging-changed', (event) => {
    if (!event.value) saveHistoryState();
  });
  scene.add(transformControls);

  window.addEventListener('resize', onResize);
  initEventListeners();
  animate();

  refreshOutliner();
  updateStatus("Editor Ready");
}

function createEditorTexture(type) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  if (type === 'brick') {
    ctx.fillStyle = '#b9b4ad';
    ctx.fillRect(0, 0, 128, 128);
    const brickW = 24;
    const brickH = 12;
    for (let y = 0; y < 128; y += brickH + 2) {
      const rowOffset = (Math.floor(y / (brickH + 2)) % 2) ? brickW / 2 : 0;
      for (let x = -rowOffset; x < 128; x += brickW + 2) {
        ctx.fillStyle = '#9f3f33';
        ctx.fillRect(x + 1, y + 1, brickW, brickH);
        ctx.fillStyle = '#7d2e25';
        ctx.fillRect(x + 1, y + brickH - 2, brickW, 2);
      }
    }
  } else if (type === 'grass') {
    ctx.fillStyle = '#3b7f31'; ctx.fillRect(0, 0, 128, 128);
    ctx.fillStyle = '#2f6b27'; for (let i = 0; i < 500; i++) ctx.fillRect(Math.random() * 128, Math.random() * 128, 2, 2);
  } else if (type === 'asphalt') {
    ctx.fillStyle = '#3c3f45'; ctx.fillRect(0, 0, 128, 128);
    ctx.fillStyle = '#5f636a'; for (let i = 0; i < 300; i++) ctx.fillRect(Math.random() * 128, Math.random() * 128, 1, 1);
  } else if (type === 'metal') {
    ctx.fillStyle = '#6b7280'; ctx.fillRect(0, 0, 128, 128);
    ctx.strokeStyle = '#4b5563'; for (let x = 0; x < 128; x += 16) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 128); ctx.stroke(); }
  } else if (type === 'concrete') {
    ctx.fillStyle = '#7d7d7d'; ctx.fillRect(0, 0, 128, 128);
    ctx.fillStyle = '#6d6d6d'; for (let i = 0; i < 500; i++) ctx.fillRect(Math.random() * 128, Math.random() * 128, 1, 1);
  } else if (type === 'wood') {
    ctx.fillStyle = '#8b5a2b'; ctx.fillRect(0, 0, 128, 128);
    ctx.strokeStyle = '#6e4521'; for (let y = 0; y < 128; y += 12) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(128, y + 4); ctx.stroke(); }
  } else {
    ctx.fillStyle = '#94a3b8'; ctx.fillRect(0, 0, 128, 128);
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(1, 1);
  return texture;
}

function getEditorTexture(type) {
  if (!textureCache[type]) textureCache[type] = createEditorTexture(type);
  return textureCache[type];
}

function applyObjectVisual(obj) {
  if (obj.type !== 'box') return;
  const materialName = obj.data.material || 'default';
  obj.mesh.material = new THREE.MeshPhongMaterial({
    color: 0xffffff,
    map: getEditorTexture(materialName)
  });
}

function serializeCurrentMap() {
  return {
    boxes: objects.filter(o => o.type === 'box').map(o => JSON.parse(JSON.stringify(o.data))),
    spawns: objects.filter(o => o.type === 'spawn').map(o => JSON.parse(JSON.stringify(o.data))),
    lights: objects.filter(o => o.type === 'light').map(o => JSON.parse(JSON.stringify(o.data))),
    pickups: objects.filter(o => o.type === 'pickup').map(o => JSON.parse(JSON.stringify(o.data)))
  };
}

function saveHistoryState() {
  undoStack.push(serializeCurrentMap());
  if (undoStack.length > 100) undoStack.shift();
}

function undoLastAction() {
  if (undoStack.length <= 1) return;
  undoStack.pop();
  loadMapData(undoStack[undoStack.length - 1], { saveHistory: false });
  updateStatus('Undo');
}

function onResize() {
  const width = canvas.parentElement.clientWidth;
  const height = canvas.parentElement.clientHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height, false);
}

function animate() {
  requestAnimationFrame(animate);
  handleCameraMovement();
  renderer.render(scene, camera);
}

// Camera Movement (Fly Style)
const keys = {};
const flyCameraKeyCodes = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ShiftLeft', 'ShiftRight']);

function isTextEntryActive() {
  const activeEl = document.activeElement;
  if (!activeEl) return false;
  const tag = activeEl.tagName;
  return activeEl.isContentEditable || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
}

function isFlyCameraActive() {
  return document.pointerLockElement === canvas;
}

window.addEventListener('keydown', e => {
  if (isTextEntryActive()) return;
  keys[e.key.toLowerCase()] = true;
  if (isFlyCameraActive() && flyCameraKeyCodes.has(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  if (isFlyCameraActive() && flyCameraKeyCodes.has(e.code)) e.preventDefault();
});

let yaw = -Math.PI / 4, pitch = -Math.PI / 4;
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('mousedown', (e) => {
  if (e.button === 2) {
    e.preventDefault();
    canvas.focus({ preventScroll: true });
    canvas.requestPointerLock();
  }
});
document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement === canvas) {
    yaw -= e.movementX * 0.003;
    pitch -= e.movementY * 0.003;
    pitch = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, pitch));
  }
});
document.addEventListener('mouseup', (e) => {
  if (e.button === 2 && isFlyCameraActive()) document.exitPointerLock();
});

function handleCameraMovement() {
  if (isTesting) return;
  if (document.pointerLockElement !== canvas) return;
  const dir = new THREE.Vector3(
    Math.sin(yaw) * Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw) * Math.cos(pitch)
  );
  const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), dir).normalize();
  const speed = keys.shift ? 0.4 : 0.15;
  if (keys.w) camera.position.addScaledVector(dir, speed);
  if (keys.s) camera.position.addScaledVector(dir, -speed);
  if (keys.a) camera.position.addScaledVector(right, speed);
  if (keys.d) camera.position.addScaledVector(right, -speed);
  camera.lookAt(camera.position.clone().add(dir));
}


// Object Management
function addObject(type, data = {}) {
  let mesh;
  const defaultData = { pos: [0, 0, 0], rot: [0, 0, 0], size: [1, 1, 1], material: 'default' };
  const finalData = { ...defaultData, ...data };

  if (type === 'box') {
    mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshPhongMaterial({ color: 0x94a3b8 })
    );
  } else if (type === 'spawn') {
    mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 2, 8),
      new THREE.MeshBasicMaterial({ color: 0x22c55e, wireframe: true })
    );
    finalData.team = data.team || 0;
  } else if (type === 'light') {
    mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xeab308 })
    );
    finalData.lightType = data.lightType || 'point';
    finalData.intensity = data.intensity || 1;
    finalData.color = data.color || '#ffffff';
  } else if (type === 'pickup') {
    mesh = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.5),
      new THREE.MeshBasicMaterial({ color: 0x3b82f6, wireframe: true })
    );
    finalData.pickupType = data.pickupType || 'health';
  }

  mesh.position.set(...finalData.pos);
  mesh.rotation.set(...finalData.rot);
  mesh.scale.set(...finalData.size);
  mesh.userData.index = objects.length;

  scene.add(mesh);
  const obj = { type, mesh, data: finalData };
  objects.push(obj);
  applyObjectVisual(obj);

  selectObject(objects.length - 1, false);
  refreshOutliner();
  updateStatus(`Added ${type}`);
}

function selectObject(index, additive = false) {
  selectedIndices.forEach(i => {
    if (objects[i] && objects[i].mesh) scene.attach(objects[i].mesh);
  });
  transformControls.detach();

  if (index === -1) {
    selectedIndices = [];
  } else if (additive) {
    const idx = selectedIndices.indexOf(index);
    if (idx >= 0) {
      selectedIndices.splice(idx, 1);
    } else {
      selectedIndices.push(index);
    }
  } else {
    selectedIndices = [index];
  }

  if (selectedIndices.length > 0) {
    selectionGroup.position.set(0, 0, 0);
    selectionGroup.rotation.set(0, 0, 0);
    selectionGroup.scale.set(1, 1, 1);

    const firstMesh = objects[selectedIndices[0]].mesh;
    firstMesh.getWorldPosition(selectionGroup.position);

    selectedIndices.forEach(i => {
      selectionGroup.attach(objects[i].mesh);
    });
    transformControls.attach(selectionGroup);
  }

  refreshOutliner();
  refreshInspector();
}

function syncObjectDataFromMesh(index) {
  const obj = objects[index];
  const mesh = obj.mesh;
  const pos = new THREE.Vector3();
  const rot = new THREE.Quaternion();
  const scale = new THREE.Vector3();
  mesh.matrixWorld.decompose(pos, rot, scale);
  const euler = new THREE.Euler().setFromQuaternion(rot);

  obj.data.pos = [pos.x, pos.y, pos.z];
  obj.data.rot = [euler.x, euler.y, euler.z];
  obj.data.size = [scale.x, scale.y, scale.z];

  if (selectedIndices[0] === index) refreshInspector();
}

function deleteSelected() {
  if (selectedIndices.length === 0) return;
  saveHistoryState();

  selectedIndices.forEach(i => {
    if (objects[i] && objects[i].mesh) scene.attach(objects[i].mesh);
  });
  transformControls.detach();

  selectedIndices.sort((a,b) => b - a);
  selectedIndices.forEach(i => {
    const obj = objects[i];
    scene.remove(obj.mesh);
    if(obj.mesh.geometry) obj.mesh.geometry.dispose();
    objects.splice(i, 1);
  });

  objects.forEach((o, i) => o.mesh.userData.index = i);

  selectedIndices = [];
  refreshOutliner();
  refreshInspector();
  updateStatus("Objects Deleted");
}

function duplicateSelected() {
  if (selectedIndices.length === 0) return;
  saveHistoryState();

  const toAdd = [];
  selectedIndices.forEach(i => {
    const original = objects[i];
    const newData = JSON.parse(JSON.stringify(original.data));
    newData.pos[0] += 1;
    newData.pos[2] += 1;
    toAdd.push({type: original.type, data: newData});
  });

  selectedIndices = [];
  toAdd.forEach(item => {
    addObject(item.type, item.data);
    selectedIndices.push(objects.length - 1);
  });
  selectObject(-1);
  selectedIndices = toAdd.map((_, idx) => objects.length - toAdd.length + idx);
  selectedIndices.forEach(idx => selectObject(idx, true));
}

function copySelected() {
  if (selectedIndices.length === 0) return;
  copiedObject = selectedIndices.map(i => ({
    type: objects[i].type,
    data: JSON.parse(JSON.stringify(objects[i].data))
  }));
  updateStatus(`Copied ${selectedIndices.length} objects`);
}

function pasteCopiedObject() {
  if (!copiedObject || copiedObject.length === 0) return;
  saveHistoryState();

  const toSelect = [];
  copiedObject.forEach(item => {
    const newData = JSON.parse(JSON.stringify(item.data));
    if (Array.isArray(newData.pos) && newData.pos.length === 3) {
      newData.pos[0] += 1;
      newData.pos[2] += 1;
    }
    addObject(item.type, newData);
    toSelect.push(objects.length - 1);
  });

  selectObject(-1);
  toSelect.forEach(idx => selectObject(idx, true));
  updateStatus(`Pasted ${copiedObject.length} objects`);
}

// UI Refresh
function refreshOutliner() {
  outlinerEl.innerHTML = '';
  objects.forEach((obj, i) => {
    const div = document.createElement('div');
    div.className = `outliner-item ${selectedIndices.includes(i) ? 'selected' : ''}`;
    div.innerHTML = `<span>${getIcon(obj.type)}</span> ${obj.type} #${i+1}`;
    div.onclick = (e) => selectObject(i, e.shiftKey || e.ctrlKey || e.metaKey);
    outlinerEl.appendChild(div);
  });
}

function getIcon(type) {
  if (type === 'box') return '📦';
  if (type === 'spawn') return '🚩';
  if (type === 'light') return '💡';
  if (type === 'pickup') return '➕';
  return '❓';
}

function refreshInspector() {
  if (selectedIndices.length === 0) {
    inspectorEl.innerHTML = '<div class="empty-msg">Select an object to view properties</div>';
    return;
  }
  const obj = objects[selectedIndices[0]];
  const multiText = selectedIndices.length > 1 ? `<div class="hint">(${selectedIndices.length} items selected. Edits apply to all.)</div>` : '';
  const d = obj.data;

  let html = `
    <div class="property-group">
      <h4>Transform</h4>
      ${renderPropRow('Pos X', 'number', d.pos[0], v => updateSelectedProp('pos', 0, v))}
      ${renderPropRow('Pos Y', 'number', d.pos[1], v => updateSelectedProp('pos', 1, v))}
      ${renderPropRow('Pos Z', 'number', d.pos[2], v => updateSelectedProp('pos', 2, v))}
      <div style="height:8px"></div>
      ${renderPropRow('Size X', 'number', d.size[0], v => updateSelectedProp('size', 0, v))}
      ${renderPropRow('Size Y', 'number', d.size[1], v => updateSelectedProp('size', 1, v))}
      ${renderPropRow('Size Z', 'number', d.size[2], v => updateSelectedProp('size', 2, v))}
    </div>
  `;

  if (obj.type === 'box') {
    html += `
      <div class="property-group">
        <h4>Material</h4>
        ${renderPropRow('Type', 'select', d.material, v => updateSelectedProp('material', null, v), ['default', 'brick', 'grass', 'asphalt', 'metal', 'concrete', 'wood'])}
      </div>
    `;
  } else if (obj.type === 'spawn') {
    html += `
      <div class="property-group">
        <h4>Spawn Settings</h4>
        ${renderPropRow('Team ID', 'number', d.team, v => updateSelectedProp('team', null, v))}
        <div class="hint" style="font-size:10px; color:var(--text-muted); margin-top:4px;">0=FFA/None, 1=Red, 2=Blue</div>
      </div>
    `;
  } else if (obj.type === 'light') {
    html += `
      <div class="property-group">
        <h4>Light Settings</h4>
        ${renderPropRow('Type', 'select', d.lightType, v => updateSelectedProp('lightType', null, v), ['point', 'directional'])}
        ${renderPropRow('Intensity', 'number', d.intensity, v => updateSelectedProp('intensity', null, v))}
        ${renderPropRow('Color', 'color', d.color, v => updateSelectedProp('color', null, v))}
      </div>
    `;
  } else if (obj.type === 'pickup') {
    html += `
      <div class="property-group">
        <h4>Pickup Settings</h4>
        ${renderPropRow('Type', 'select', d.pickupType, v => updateSelectedProp('pickupType', null, v), ['health', 'armor'])}
      </div>
    `;
  }

  inspectorEl.innerHTML = multiText + html;

  // Re-attach event listeners for inputs
  inspectorEl.querySelectorAll('input, select').forEach(el => {
    el.onchange = (e) => {
      const val = e.target.type === 'number' ? parseFloat(e.target.value) : e.target.value;
      el._callback(val);
    };
  });
}

function renderPropRow(label, type, value, callback, options = []) {
  let input = '';
  if (type === 'select') {
    input = `<select>${options.map(o => `<option value="${o}" ${o === value ? 'selected' : ''}>${o}</option>`).join('')}</select>`;
  } else {
    input = `<input type="${type}" value="${value}" step="0.5">`;
  }

  const id = 'prop_' + Math.random().toString(36).substr(2, 9);
  // Temporary storage of callback
  setTimeout(() => {
    const el = document.getElementById(id);
    if (el) el._callback = callback;
  }, 0);

  return `
    <div class="property-row">
      <label>${label}</label>
      <div id="${id}_container">${input.replace('<input', `<input id="${id}"`).replace('<select', `<select id="${id}"`)}</div>
    </div>
  `;
}

function updateSelectedProp(key, index, value) {
  if (selectedIndices.length === 0) return;
  selectedIndices.forEach(i => {
    const obj = objects[i];
    if (index !== null) {
      obj.data[key][index] = value;
    } else {
      obj.data[key] = value;
    }

    const mesh = obj.mesh;
    if (key === 'pos') mesh.position.set(...obj.data.pos);
    if (key === 'rot') mesh.rotation.set(...obj.data.rot);
    if (key === 'size') mesh.scale.set(...obj.data.size);
    if (key === 'material') applyObjectVisual(obj);
  });

  updateStatus(`Updated ${key}`);
}

// I/O
async function loadBuiltin() {
  const id = builtinMaps.value;
  if (!id) return;
  try {
    const res = await fetch(`../data/fps/maps/${id}.json`);
    const map = await res.json();
    loadMapData(map);
    updateStatus(`Loaded built-in map ${id}`);
  } catch (e) {
    updateStatus("Load failed: " + e.message);
  }
}

function loadMapData(map, options = { saveHistory: true }) {
  // Clear
  objects.forEach(o => scene.remove(o.mesh));
  objects = [];

  if (map.boxes) map.boxes.forEach(b => addObject('box', b));
  if (map.spawns) map.spawns.forEach(s => addObject('spawn', s));
  if (map.lights) map.lights.forEach(l => addObject('light', l));
  if (map.pickups) map.pickups.forEach(p => addObject('pickup', p));

  selectObject(-1);
  refreshOutliner();
  if (options.saveHistory !== false) saveHistoryState();
}

function downloadJson() {
  const map = {
    schema: 'fps-map-v2',
    name: 'Custom Map',
    boxes: objects.filter(o => o.type === 'box').map(o => o.data),
    spawns: objects.filter(o => o.type === 'spawn').map(o => o.data),
    lights: objects.filter(o => o.type === 'light').map(o => o.data),
    pickups: objects.filter(o => o.type === 'pickup').map(o => o.data),
    environment: {
      background: 0x0f172a,
      fogColor: 0x0f172a,
      floorTexture: 'concrete'
    }
  };
  const blob = new Blob([JSON.stringify(map, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'map.json';
  a.click();
  updateStatus("Map Downloaded");
}

function updateStatus(msg) {
  statusText.textContent = msg;
}

// Event Listeners

let isTesting = false;
let testControls;
let testVelocity = new THREE.Vector3();
let testDirection = new THREE.Vector3();
let testMoveForward = false;
let testMoveBackward = false;
let testMoveLeft = false;
let testMoveRight = false;
let testCanJump = false;
let testPrevTime = performance.now();
let testGameLoopId = null;

function initTestControls() {
  testControls = new PointerLockControls(camera, document.body);
  scene.add(testControls.getObject());

  testControls.addEventListener('lock', () => {
    isTesting = true;
    testMapOverlay.style.display = 'flex';
    document.querySelector('.top-nav').style.display = 'none';
    document.querySelector('.bottom-bar').style.display = 'none';
    document.querySelector('.left-sidebar').style.display = 'none';
    document.querySelector('.right-sidebar').style.display = 'none';
    document.querySelector('.viewport-toolbar').style.display = 'none';

    // Force resize to ensure canvas takes full screen
    setTimeout(() => window.dispatchEvent(new Event('resize')), 100);

    const spawns = objects.filter(o => o.type === 'spawn');
    if (spawns.length > 0) {
      const sp = spawns[0].mesh.position;
      testControls.getObject().position.set(sp.x, sp.y + 1, sp.z);
    } else {
      testControls.getObject().position.y = 2;
    }

    transformControls.detach();
    testPrevTime = performance.now();
    testLoop();
  });

  testControls.addEventListener('unlock', () => {
    isTesting = false;
    testMapOverlay.style.display = 'none';
    document.querySelector('.top-nav').style.display = 'flex';
    document.querySelector('.bottom-bar').style.display = 'flex';
    document.querySelector('.left-sidebar').style.display = 'flex';
    document.querySelector('.right-sidebar').style.display = 'flex';
    document.querySelector('.viewport-toolbar').style.display = 'flex';

    setTimeout(() => window.dispatchEvent(new Event('resize')), 100);
    cancelAnimationFrame(testGameLoopId);

    camera.position.set(10, 10, 10);
    camera.lookAt(0,0,0);
    yaw = -Math.PI/4;
    pitch = -Math.PI/4;
  });
}

function testLoop() {
  if (!isTesting) return;
  testGameLoopId = requestAnimationFrame(testLoop);

  const time = performance.now();
  const delta = (time - testPrevTime) / 1000;

  testVelocity.x -= testVelocity.x * 10.0 * delta;
  testVelocity.z -= testVelocity.z * 10.0 * delta;
  testVelocity.y -= 40.0 * delta;

  testDirection.z = Number(testMoveForward) - Number(testMoveBackward);
  testDirection.x = Number(testMoveRight) - Number(testMoveLeft);
  testDirection.normalize();

  if (testMoveForward || testMoveBackward) testVelocity.z -= testDirection.z * 40.0 * delta;
  if (testMoveLeft || testMoveRight) testVelocity.x -= testDirection.x * 40.0 * delta;

  testControls.moveRight(-testVelocity.x * delta);
  testControls.moveForward(-testVelocity.z * delta);
  testControls.getObject().position.y += (testVelocity.y * delta);

  let highestFloor = 0;
  const px = testControls.getObject().position.x;
  const pz = testControls.getObject().position.z;

  objects.forEach(obj => {
    if (obj.type === 'box') {
      const box = new THREE.Box3().setFromObject(obj.mesh);
      if (px > box.min.x - 0.5 && px < box.max.x + 0.5 && pz > box.min.z - 0.5 && pz < box.max.z + 0.5) {
        if (box.max.y > highestFloor && testControls.getObject().position.y - 1.5 >= box.max.y - 0.5) {
          highestFloor = box.max.y;
        }
      }
    }
  });

  if (testControls.getObject().position.y < highestFloor + 1.5) {
    testVelocity.y = 0;
    testControls.getObject().position.y = highestFloor + 1.5;
    testCanJump = true;
  }

  renderer.render(scene, camera);
  testPrevTime = time;
}

function addPrefab(parts) {
  saveHistoryState();
  const toSelect = [];

  let baseX = 0; let baseY = 0; let baseZ = 0;
  if (selectedIndices.length > 0) {
    const p = objects[selectedIndices[0]].mesh.position;
    baseX = p.x; baseY = p.y; baseZ = p.z;
  }

  parts.forEach(p => {
    addObject('box', {
      pos: [p.pos[0] + baseX, p.pos[1] + baseY, p.pos[2] + baseZ],
      size: p.size,
      material: p.material || 'default'
    });
    toSelect.push(objects.length - 1);
  });

  selectObject(-1);
  toSelect.forEach(idx => selectObject(idx, true));
  updateStatus("Added Prefab");
}

function initEventListeners() {
  addBoxBtn.onclick = () => addObject('box');
  addSpawnBtn.onclick = () => addObject('spawn');
  addLightBtn.onclick = () => addObject('light');
  addPickupBtn.onclick = () => addObject('pickup');

  toolMove.onclick = () => { transformControls.setMode('translate'); updateToolBtns('move'); };
  toolRotate.onclick = () => { transformControls.setMode('rotate'); updateToolBtns('rotate'); };
  toolScale.onclick = () => { transformControls.setMode('scale'); updateToolBtns('scale'); };

  btnSnap.onclick = () => {
    snapEnabled = !snapEnabled;
    transformControls.setTranslationSnap(snapEnabled ? gridStep : null);
    transformControls.setRotationSnap(snapEnabled ? THREE.MathUtils.degToRad(15) : null);
    transformControls.setScaleSnap(snapEnabled ? 0.25 : null);
    btnSnap.textContent = `Snap: ${snapEnabled ? 'ON' : 'OFF'}`;
  };

  snapStepEl.onchange = () => {
    gridStep = parseFloat(snapStepEl.value);
    if (snapEnabled) {
      transformControls.setTranslationSnap(gridStep);
    }
  };

  btnTestMap.onclick = () => {
    if (!testControls) initTestControls();
    testControls.lock();
  };

  addWallBtn.onclick = () => addPrefab([ { pos: [0, 2, 0], size: [4, 4, 1] } ]);
  addFloorBtn.onclick = () => addPrefab([ { pos: [0, 0, 0], size: [4, 1, 4] } ]);
  addDoorwayBtn.onclick = () => addPrefab([ { pos: [-1.5, 2, 0], size: [1, 4, 1] }, { pos: [1.5, 2, 0], size: [1, 4, 1] }, { pos: [0, 4.5, 0], size: [4, 1, 1] } ]);
  addWindowBtn.onclick = () => addPrefab([ { pos: [-1.5, 2, 0], size: [1, 4, 1] }, { pos: [1.5, 2, 0], size: [1, 4, 1] }, { pos: [0, 0.5, 0], size: [2, 1, 1] }, { pos: [0, 4.5, 0], size: [4, 1, 1] } ]);
  addStairsBtn.onclick = () => addPrefab([ { pos: [0, 0.5, 0], size: [4, 1, 1] }, { pos: [0, 1.5, -1], size: [4, 1, 1] }, { pos: [0, 2.5, -2], size: [4, 1, 1] }, { pos: [0, 3.5, -3], size: [4, 1, 1] } ]);
  addRoomBtn.onclick = () => addPrefab([ { pos: [0, 0, 0], size: [10, 1, 10] }, { pos: [0, 5, 0], size: [10, 1, 10] }, { pos: [0, 2.5, -4.5], size: [10, 4, 1] }, { pos: [0, 2.5, 4.5], size: [10, 4, 1] }, { pos: [-4.5, 2.5, 0], size: [1, 4, 8] }, { pos: [4.5, 2.5, 0], size: [1, 4, 8] } ]);


  btnFocus.onclick = () => {
    if (selectedIndices.length > 0) {
      const pos = objects[selectedIndices[0]].mesh.position;
      camera.position.set(pos.x + 5, pos.y + 5, pos.z + 5);
      camera.lookAt(pos);
    }
  };

  btnNew.onclick = () => { if(confirm("Clear current map?")) loadMapData({}); };
  btnOpen.onclick = () => uploadInput.click();
  btnDownload.onclick = downloadJson;
  btnLoadBuiltin.onclick = loadBuiltin;

  uploadInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (file) {
      const text = await file.text();
      loadMapData(JSON.parse(text));
    }
  };


  window.addEventListener('keydown', e => {
    if (isTesting) {
      switch (e.code) {
        case 'ArrowUp':
        case 'KeyW': testMoveForward = true; break;
        case 'ArrowLeft':
        case 'KeyA': testMoveLeft = true; break;
        case 'ArrowDown':
        case 'KeyS': testMoveBackward = true; break;
        case 'ArrowRight':
        case 'KeyD': testMoveRight = true; break;
        case 'Space':
          if (testCanJump === true) testVelocity.y += 15.0;
          testCanJump = false;
          break;
      }
      return;
    }
    if (isTextEntryActive()) return;
    if (isFlyCameraActive()) {
      if (flyCameraKeyCodes.has(e.code)) e.preventDefault();
      return;
    }

    if (e.key.toLowerCase() === 'w') toolMove.click();
    if (e.key.toLowerCase() === 'e') toolRotate.click();
    if (e.key.toLowerCase() === 'r') toolScale.click();
    if (e.key.toLowerCase() === 'f') btnFocus.click();
    if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
    if (e.key.toLowerCase() === 'd' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      duplicateSelected();
    }
    if (e.key.toLowerCase() === 'c' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      copySelected();
    }
    if (e.key.toLowerCase() === 'v' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      pasteCopiedObject();
    }
    if (e.key.toLowerCase() === 'z' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      undoLastAction();
    }
  });

  // Handle snapping initially
  transformControls.setTranslationSnap(gridStep);
}

function updateToolBtns(mode) {
  [toolMove, toolRotate, toolScale].forEach(b => b.classList.remove('active'));
  if (mode === 'move') toolMove.classList.add('active');
  if (mode === 'rotate') toolRotate.classList.add('active');
  if (mode === 'scale') toolScale.classList.add('active');
}

// Raycasting and Box Selection
canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0 || transformControls.dragging) return;
  if (document.pointerLockElement === canvas) return;

  const rect = canvas.getBoundingClientRect();
  const mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(objects.map(o => o.mesh));

  if (intersects.length > 0) {
    isBoxSelecting = false;
    selectObject(intersects[0].object.userData.index, e.shiftKey || e.ctrlKey || e.metaKey);
  } else {
    isBoxSelecting = true;
    boxSelectStart.set(e.clientX, e.clientY);
    boxSelectEnd.copy(boxSelectStart);
    selectionBoxEl.style.display = 'block';
    selectionBoxEl.style.left = e.clientX + 'px';
    selectionBoxEl.style.top = e.clientY + 'px';
    selectionBoxEl.style.width = '0px';
    selectionBoxEl.style.height = '0px';
  }
});

document.addEventListener('mousemove', (e) => {
  if (!isBoxSelecting) return;
  boxSelectEnd.set(e.clientX, e.clientY);

  const minX = Math.min(boxSelectStart.x, boxSelectEnd.x);
  const maxX = Math.max(boxSelectStart.x, boxSelectEnd.x);
  const minY = Math.min(boxSelectStart.y, boxSelectEnd.y);
  const maxY = Math.max(boxSelectStart.y, boxSelectEnd.y);

  selectionBoxEl.style.left = minX + 'px';
  selectionBoxEl.style.top = minY + 'px';
  selectionBoxEl.style.width = (maxX - minX) + 'px';
  selectionBoxEl.style.height = (maxY - minY) + 'px';
});

document.addEventListener('mouseup', (e) => {
  if (!isBoxSelecting) return;
  isBoxSelecting = false;
  selectionBoxEl.style.display = 'none';

  if (boxSelectStart.distanceTo(boxSelectEnd) < 5) {
    if (!e.shiftKey && !e.ctrlKey && !e.metaKey) selectObject(-1);
    return;
  }

  const rect = canvas.getBoundingClientRect();
  const minX = Math.min(boxSelectStart.x, boxSelectEnd.x) - rect.left;
  const maxX = Math.max(boxSelectStart.x, boxSelectEnd.x) - rect.left;
  const minY = Math.min(boxSelectStart.y, boxSelectEnd.y) - rect.top;
  const maxY = Math.max(boxSelectStart.y, boxSelectEnd.y) - rect.top;

  const toSelect = [];
  objects.forEach((obj, i) => {
    const pos = new THREE.Vector3();
    obj.mesh.getWorldPosition(pos);
    pos.project(camera);

    if (pos.z > 1) return;

    const px = (pos.x * 0.5 + 0.5) * rect.width;
    const py = (-(pos.y * 0.5) + 0.5) * rect.height;

    if (px >= minX && px <= maxX && py >= minY && py <= maxY) {
      toSelect.push(i);
    }
  });

  if (!e.shiftKey && !e.ctrlKey && !e.metaKey) selectObject(-1);
  toSelect.forEach(idx => selectObject(idx, true));
});



  window.addEventListener('keyup', e => {
    if (isTesting) {
      switch (e.code) {
        case 'ArrowUp':
        case 'KeyW': testMoveForward = false; break;
        case 'ArrowLeft':
        case 'KeyA': testMoveLeft = false; break;
        case 'ArrowDown':
        case 'KeyS': testMoveBackward = false; break;
        case 'ArrowRight':
        case 'KeyD': testMoveRight = false; break;
      }
    }
  });

init();
saveHistoryState();
</script>
